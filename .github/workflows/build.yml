name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Постоянный ключ подписи
        if: ${{ env.SIGNING_KEYSTORE != '' }}
        run: echo "$SIGNING_KEYSTORE" | base64 -d > app/sz.jks
      - run: gradle assembleDebug
      - name: Чем подписан APK
        run: |
          if [ -f app/sz.jks ]; then echo "постоянный ключ"
          else echo "ВНИМАНИЕ: отладочный ключ (секреты SIGNING_KEYSTORE и SIGNING_PASSWORD не заданы)"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: sz-app
          path: app/build/outputs/apk/debug/*.apk
