name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk rossem-phonebook.apk

      - name: Проверка разрешений (INTERNET запрещён)
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/aapt2 dump permissions rossem-phonebook.apk | tee perms.txt
          $BT/aapt2 dump badging rossem-phonebook.apk | grep -E "^package|sdkVersion|targetSdkVersion"
          if grep -q "android.permission.INTERNET" perms.txt; then echo "Найдено разрешение INTERNET"; exit 1; fi

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Справочник РосСЭМ 1.0.${{ github.run_number }}
          body: |
            Скачайте файл rossem-phonebook.apk ниже и установите на телефон.
            Постоянная ссылка на последнюю версию:
            https://github.com/${{ github.repository }}/releases/latest/download/rossem-phonebook.apk
          files: rossem-phonebook.apk
          make_latest: true
