<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор СЗ</title>
<style>
body{font-family:sans-serif;margin:0;padding:12px;background:#f2f4f7;color:#111}
h1{font-size:20px;margin:4px 0 12px}

label{display:block;font-size:13px;color:#555;margin:10px 0 3px}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:#111}
label.chk input{width:auto}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;font-size:15px;border:1px solid #ccc;border-radius:8px;background:#fff}
textarea{min-height:80px}
button{width:100%;padding:12px;font-size:16px;margin-top:10px;border:0;border-radius:8px;background:#1f5fbf;color:#fff}
button.alt{background:#555}
pre{white-space:pre-wrap;background:#fff;border:1px solid #ccc;border-radius:8px;padding:10px;font-size:14px}
.row{display:flex;gap:8px}.row>div{flex:1}
</style>
</head>
