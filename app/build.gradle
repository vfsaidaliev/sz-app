plugins {
    id 'com.android.application'
}

/* номер сборки GitHub Actions — чтобы новая версия ставилась поверх старой */
def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'ru.rossem.sz'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.rossem.sz'
        minSdk 24
        targetSdk 34
        versionCode build
        versionName "1.${build}"
    }

    /* постоянный ключ подписи: app/sz.jks создаётся в GitHub Actions из секрета SIGNING_KEYSTORE,
       пароль — секрет SIGNING_PASSWORD; без них сборка подписывается обычным отладочным ключом */
    def ks = file('sz.jks')
    signingConfigs {
        stable {
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'sz'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }
    /* рабочая сборка — release (не отлаживаемая: данные приложения нельзя извлечь через ADB) */
    buildTypes {
        debug {
            if (ks.exists()) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            signingConfig ks.exists() ? signingConfigs.stable : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
