plugins {
    id 'com.android.application'
}

/* номер сборки GitHub Actions — чтобы новая версия ставилась поверх старой */
def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'ru.rossem.sz'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.rossem.sz'
        minSdk 24
        targetSdk 34
        versionCode build
        versionName "1.${build}"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
